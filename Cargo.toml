[package]
name = "kaotik"
version = "0.1.0"
edition = "2021"
description = "Kaotik Sifreleme - platform-independent crypto library and CLI"
license = "MIT"

[lib]
name = "kaotik"
path = "src/lib.rs"

[[bin]]
name = "kaotik"
path = "src/main.rs"

[features]
default = []
ffi = []    # C FFI (no_mangle extern "C")

[dependencies]
getrandom = "0.2"
aes-gcm = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
hkdf = "0.12"
argon2 = "0.5"
pqcrypto-kyber = "0.8"
zeroize = "1.7"
pqcrypto-traits = "0.3.5"
clap = { version = "4.4", features = ["derive"] }
subtle = "2.6"
hmac = "0.12"
chacha20poly1305 = "0.10"
ml-dsa = "0.1.1"
ed25519-dalek = "3"
ml-kem = { version = "0.3.3", features = ["getrandom", "zeroize"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }

# Argon2 (256 MiB) debug derlemede de makul hızda çalışsın.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# Reproducible, hardened release builds (see .github/workflows/release.yml).
[profile.release]
codegen-units = 1      # deterministic codegen partitioning, better optimization
lto = true
# panic = "abort" is intentionally NOT set: zeroize-on-drop (Zeroizing<..>,
# ZeroizeOnDrop) only wipes secrets if Drop runs, which requires unwinding.
strip = "symbols"      # no local paths/symbols in the shipped binary
debug = false
incremental = false
# Overflow checks are cheap here and turn silent wrap-around in length/offset
# arithmetic (header parsing, chunk counters) into a clean panic.
overflow-checks = true
