name: ClusterFuzzLite PR fuzzing
on:
  pull_request:
    paths: ['src/**', 'fuzz/**', 'Cargo.toml', 'Cargo.lock', '.clusterfuzzlite/**']
permissions: read-all
concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  PR:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
          output-sarif: false
