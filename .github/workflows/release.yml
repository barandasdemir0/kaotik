name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   exe: kaotik }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  exe: kaotik }
          - { os: macos-latest,   target: aarch64-apple-darwin,       exe: kaotik }
          - { os: macos-latest,   target: x86_64-apple-darwin,        exe: kaotik }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     exe: kaotik.exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Reproducibility env
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          ws='${{ github.workspace }}'
          ch="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=${ws}=/build --remap-path-prefix=${ch}=/cargo -C strip=symbols" >> "$GITHUB_ENV"
          # C code (pqcrypto-internals via cc): strip build paths from objects.
          # MSVC cl.exe does not understand this flag, so skip it on Windows.
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "CFLAGS=-ffile-prefix-map=${ws}=/build -ffile-prefix-map=${ch}=/cargo" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo build --release --locked --offline --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" out/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.target }}
          path: out/${{ matrix.exe }}
          if-no-files-found: error

  package:
    # All archives are created here on one Linux runner with GNU tar/zip,
    # so packaging is deterministic regardless of the build OS.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          path: bins

      - name: Package
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export TZ=UTC
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for dir in bins/bin-*; do
            target="${dir#bins/bin-}"
            name="kaotik-${version}-${target}"
            mkdir -p "stage/$name"
            cp "$dir"/* LICENSE README.md "stage/$name/"
            chmod 0755 "stage/$name"/kaotik*; chmod 0644 "stage/$name"/LICENSE "stage/$name"/README.md
            find "stage/$name" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
            if [[ "$target" == *windows* ]]; then
              (cd stage && find "$name" | LC_ALL=C sort | zip -X -q "../dist/$name.zip" -@)
            else
              tar -C stage --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
                --owner=0 --group=0 --numeric-owner --format=gnu \
                -cf - "$name" | gzip -9 -n > "dist/$name.tar.gz"
            fi
          done
          (cd dist && sha256sum -- * | LC_ALL=C sort -k2 > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write       # create release
      id-token: write       # Sigstore keyless + attestations OIDC
      attestations: write   # SLSA build provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          fail_on_unmatched_files: true
